apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ci-web
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ci-kind-omitted
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ci-manual
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ci-unused
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: web
  namespace: kp-certs
spec:
  issuerRef:
    name: ci-web
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kind-omitted
  namespace: kp-certs
spec:
  issuerRef:
    name: ci-kind-omitted
---
apiVersion: cert-manager.io/v1
kind: CertificateRequest
metadata:
  name: manual
  namespace: kp-certs
spec:
  issuerRef:
    name: ci-manual
    kind: ClusterIssuer
    group: cert-manager.io
