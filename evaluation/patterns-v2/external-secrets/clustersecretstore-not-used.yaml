# v2: G1 and G3 resolved. Per-entry references (data[@]) correlate the store name with its
# kind, which defaults to SecretStore when omitted, so an entry naming a SecretStore of the
# same name is not a use (probe css-g1b).
apiVersion: kubepattern.dev/v1
kind: Pattern
metadata:
  name: eso-clustersecretstore-not-used
  labels:
    kubepattern.dev/suite: eval-v2
    kubepattern.dev/platform: external-secrets
spec:
  displayName: ClusterSecretStore Not Used
  category: Security
  severity: MEDIUM
  message: "ClusterSecretStore {{target.metadata.name}} is not referenced by any ExternalSecret or ClusterExternalSecret, but keeps cluster-wide credentials to an external provider."
  reference: "https://external-secrets.io/latest/api/clustersecretstore/"
  target:
    kind: ClusterSecretStore
    apiVersion: external-secrets.io/v1
    plural: clustersecretstores
  dependencies:
    - id: externalsecret
      kind: ExternalSecret
      apiVersion: external-secrets.io/v1
      plural: externalsecrets
    - id: ces
      kind: ClusterExternalSecret
      apiVersion: external-secrets.io/v1
      plural: clusterexternalsecrets
  relationships:
    matchNone:
      - with: externalsecret
        type: custom
        criteria:
          - {targetPath: "metadata.name", dependencyPath: "spec.secretStoreRef.name", operator: EQUALS}
          - {targetPath: "kind", dependencyPath: "spec.secretStoreRef.kind", dependencyDefault: {value: SecretStore}, operator: EQUALS}
      - with: externalsecret
        type: custom
        criteria:
          - {targetPath: "metadata.name", dependencyPath: "spec.data[@].sourceRef.storeRef.name", operator: EQUALS}
          - {targetPath: "kind", dependencyPath: "spec.data[@].sourceRef.storeRef.kind", dependencyDefault: {value: SecretStore}, operator: EQUALS}
      - with: ces
        type: custom
        criteria:
          - {targetPath: "metadata.name", dependencyPath: "spec.externalSecretSpec.secretStoreRef.name", operator: EQUALS}
          - {targetPath: "kind", dependencyPath: "spec.externalSecretSpec.secretStoreRef.kind", dependencyDefault: {value: SecretStore}, operator: EQUALS}
