# ----------------------------------------------------------------------------
# Per-pod resource metrics (Prometheus)
# ----------------------------------------------------------------------------
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: demo-app-backend-86ccc4747f-gzc4v-get-pod-resources
  namespace: demo-app
  labels:
    krateo.io/managed-by: demo-app-restaction-for-pod-resources
spec:
  api:
  - endpointRef:
      name: prometheus-endpoint
      namespace: krateo-system
    name: memory_data_requests
    path: ${ "/api/v1/query_range?query=" + ("kube_pod_container_resource_requests{namespace=\"" + "demo-app"
      + "\", pod=\"" + "demo-app-backend-86ccc4747f-gzc4v" + "\", resource=\"memory\"}" | @uri) + "&start="
      + ((now - 1200) | tostring) + "&end=" + (now | tostring) + "&step=5m" }
    verb: GET
  - endpointRef:
      name: prometheus-endpoint
      namespace: krateo-system
    name: memory_data_usage
    path: ${ "/api/v1/query_range?query=" + ("container_memory_working_set_bytes{namespace=\"" + "demo-app"
      + "\", pod=\"" + "demo-app-backend-86ccc4747f-gzc4v" + "\"}" | @uri) + "&start=" + ((now - 1200)
      | floor | tostring) + "&end=" + (now | floor | tostring) + "&step=5m" }
    verb: GET
  - endpointRef:
      name: prometheus-endpoint
      namespace: krateo-system
    name: memory_data_limits
    path: ${ "/api/v1/query_range?query=" + ("kube_pod_container_resource_limits{namespace=\"" + "demo-app"
      + "\", pod=\"" + "demo-app-backend-86ccc4747f-gzc4v" + "\", resource=\"memory\"}" | @uri) + "&start="
      + ((now - 1200) | tostring) + "&end=" + (now | tostring) + "&step=5m" }
    verb: GET
  - endpointRef:
      name: prometheus-endpoint
      namespace: krateo-system
    name: cpu_data_requests
    path: ${ "/api/v1/query_range?query=" + ("kube_pod_container_resource_requests{namespace=\"" + "demo-app"
      + "\", pod=\"" + "demo-app-backend-86ccc4747f-gzc4v" + "\", resource=\"cpu\"}" | @uri) + "&start="
      + ((now - 1200) | floor | tostring) + "&end=" + (now | floor | tostring) + "&step=5m" }
    verb: GET
  - endpointRef:
      name: prometheus-endpoint
      namespace: krateo-system
    name: cpu_data_usage
    path: ${ "/api/v1/query_range?query=" + ("sum(rate(container_cpu_usage_seconds_total{namespace=\""
      + "demo-app" + "\", pod=\"" + "demo-app-backend-86ccc4747f-gzc4v" + "\", container!=\"\"}[5m]))"
      | @uri) + "&start=" + ((now - 1200) | floor | tostring) + "&end=" + (now | floor | tostring) + "&step=5m"
      }
    verb: GET
  - endpointRef:
      name: prometheus-endpoint
      namespace: krateo-system
    name: cpu_data_limits
    path: ${ "/api/v1/query_range?query=" + ("kube_pod_container_resource_limits{namespace=\"" + "demo-app"
      + "\", pod=\"" + "demo-app-backend-86ccc4747f-gzc4v" + "\", resource=\"cpu\"}" | @uri) + "&start="
      + ((now - 1200) | floor | tostring) + "&end=" + (now | floor | tostring) + "&step=5m" }
    verb: GET
  filter: '{ "memory": { "requests": ( .memory_data_requests.data.result[0].values // [] | map({ xAxis:
    (.[0] | localtime | strftime("%H:%M")), yAxis: (.[1] | tonumber / 1024 / 1024 | round | tostring)
    }) ), "limits": ( .memory_data_limits.data.result[0].values // [] | map({ xAxis: (.[0] | localtime
    | strftime("%H:%M")), yAxis: (.[1] | tonumber / 1024 / 1024 | round | tostring) }) ), "usage": ( .memory_data_usage.data.result[0].values
