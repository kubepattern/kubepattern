# ----------------------------------------------------------------------------
# KubePattern rules (cluster-scoped)
# ----------------------------------------------------------------------------
apiVersion: kubepattern.dev/v1
kind: Pattern
metadata:
  name: page-not-referenced
spec:
  category: Architecture
  dependencies:
  - apiVersion: widgets.templates.krateo.io/v1beta1
    id: navmenuitem
    kind: NavMenuItem
    plural: navmenuitems
  - apiVersion: widgets.templates.krateo.io/v1beta1
    id: panel
    kind: Panel
    plural: panels
  displayName: Page Not Referenced
  message: Page {{target.metadata.name}} in namespace {{target.metadata.namespace}} is not managed by
    any NavMenuItem.
  relationships:
    matchNone:
    - criteria:
      - dependencyPath: spec.resourcesRefs.items[*].name
        operator: EQUALS
        targetPath: metadata.name
      - dependencyPath: spec.resourcesRefs.items[*].namespace
        operator: EQUALS
        targetPath: metadata.namespace
      type: custom
      with: navmenuitem
    - criteria:
      - dependencyPath: spec.resourcesRefs.items[*].name
        operator: EQUALS
        targetPath: metadata.name
      - dependencyPath: spec.resourcesRefs.items[*].namespace
        operator: EQUALS
        targetPath: metadata.namespace
      type: custom
      with: panel
  severity: HIGH
  target:
    apiVersion: widgets.templates.krateo.io/v1beta1
    filters:
      matchNone:
      - operator: EQUALS
        path: metadata.namespace
        values:
        - krateo-system
    kind: Page
    plural: pages
---
apiVersion: kubepattern.dev/v1
kind: Pattern
metadata:
  name: panel-not-referenced
spec:
  category: Architecture
  dependencies:
  - apiVersion: widgets.templates.krateo.io/v1beta1
    id: parent-panel
    kind: Panel
    plural: panels
  - apiVersion: widgets.templates.krateo.io/v1beta1
    id: column
    kind: Column
    plural: columns
  - apiVersion: widgets.templates.krateo.io/v1beta1
    id: row
    kind: Row
    plural: rows
  - apiVersion: widgets.templates.krateo.io/v1beta1
    id: tablist
    kind: TabList
    plural: tablists
  - apiVersion: widgets.templates.krateo.io/v1beta1
    id: page
    kind: Page
    plural: pages
  - apiVersion: widgets.templates.krateo.io/v1beta1
    id: datagrid
    kind: DataGrid
    plural: datagrids
  - apiVersion: composition.krateo.io/v1-0-10
    id: portalblueprintpage
    kind: PortalBlueprintPage
    plural: portalblueprintpages
  displayName: Panel Not Referenced
  message: Panel {{target.metadata.name}} in namespace {{target.metadata.namespace}} is not included in
    any layout (Row, Column, TabList or Panel).
  reference: https://docs.krateo.io/widgets/panel
  relationships:
    matchNone:
    - criteria:
      - dependencyPath: spec.resourcesRefs.items[*].name
        operator: EQUALS
        targetPath: metadata.name
      type: custom
      with: parent-panel
    - criteria:
      - dependencyPath: spec.resourcesRefs.items[*].name
        operator: EQUALS
        targetPath: metadata.name
      type: custom
      with: column
    - criteria:
      - dependencyPath: spec.resourcesRefs.items[*].name
        operator: EQUALS
        targetPath: metadata.name
      type: custom
      with: row
    - criteria:
      - dependencyPath: spec.resourcesRefs.items[*].name
        operator: EQUALS
        targetPath: metadata.name
      type: custom
      with: tablist
    - criteria:
      - dependencyPath: spec.resourcesRefs.items[*].name
        operator: EQUALS
        targetPath: metadata.name
      type: custom
      with: page
    - criteria:
      - dependencyPath: spec.resourcesRefs.items[*].name
        operator: EQUALS
        targetPath: metadata.name
      type: custom
      with: datagrid
    - criteria:
      - dependencyPath: status.managed[*].name
        operator: EQUALS
        targetPath: metadata.name
      type: custom
      with: portalblueprintpage
  severity: MEDIUM
  target:
    apiVersion: widgets.templates.krateo.io/v1beta1
    filters:
      matchNone:
      - operator: EQUALS
        path: metadata.namespace
        values:
        - krateo-system
    kind: Panel
    plural: panels
---
apiVersion: kubepattern.dev/v1
kind: Pattern
metadata:
  name: paragraph-not-referenced
spec:
  category: Architecture
  dependencies:
  - apiVersion: widgets.templates.krateo.io/v1beta1
    id: panel
    kind: Panel
    plural: panels
  - apiVersion: widgets.templates.krateo.io/v1beta1
    id: column
    kind: Column
    plural: columns
  - apiVersion: widgets.templates.krateo.io/v1beta1
    id: row
    kind: Row
    plural: rows
  displayName: Paragraph Not Referenced
  message: Paragraph {{target.metadata.name}} in namespace {{target.metadata.namespace}} is not managed
    by any widgets.
  relationships:
    matchNone:
    - criteria:
      - dependencyPath: spec.resourcesRefs.items[*].name
        operator: EQUALS
        targetPath: metadata.name
      - dependencyPath: spec.resourcesRefs.items[*].namespace
        operator: EQUALS
        targetPath: metadata.namespace
      type: custom
      with: panel
    - criteria:
      - dependencyPath: spec.resourcesRefs.items[*].name
        operator: EQUALS
        targetPath: metadata.name
      - dependencyPath: spec.resourcesRefs.items[*].namespace
        operator: EQUALS
        targetPath: metadata.namespace
      type: custom
      with: column
    - criteria:
      - dependencyPath: spec.resourcesRefs.items[*].name
        operator: EQUALS
        targetPath: metadata.name
      - dependencyPath: spec.resourcesRefs.items[*].namespace
        operator: EQUALS
        targetPath: metadata.namespace
      type: custom
      with: row
  severity: HIGH
  target:
    apiVersion: widgets.templates.krateo.io/v1beta1
    filters:
      matchNone:
      - operator: EQUALS
        path: metadata.namespace
        values:
        - krateo-system
    kind: Paragraph
    plural: paragraphs
