# Informer-cached list of every secrets (v1), all namespaces.
# Projected to name and namespace: policies only see the references (the informer still watches whole Secrets).
apiVersion: kyverno.io/v2
kind: GlobalContextEntry
metadata:
  name: secrets.core
spec:
  kubernetesResource:
    group: ""
    version: v1
    resource: secrets
  projections:
    - name: refs
      jmesPath: "[].{name: metadata.name, namespace: metadata.namespace}"
