# Best-effort variant of equivalent/paragraph-not-referenced.yaml.
# G1: name, namespace and resource are correlated on the same resourcesRefs item.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: paragraph-not-referenced
spec:
  validationActions: [Audit]
  evaluation:
    admission:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ["widgets.templates.krateo.io"]
        apiVersions: ["v1beta1"]
        resources: ["paragraphs"]
        operations: ["CREATE", "UPDATE"]
  matchConditions:
    - name: not-krateo-system
      expression: object.metadata.namespace != 'krateo-system'
  variables:
    - name: panels
      expression: globalContext.Get("panels.widgets.templates.krateo.io", "")
    - name: columns
      expression: globalContext.Get("columns.widgets.templates.krateo.io", "")
    - name: rows
      expression: globalContext.Get("rows.widgets.templates.krateo.io", "")
  validations:
    - expression: >-
        [variables.panels, variables.columns, variables.rows].exists(l, dyn(l).exists(d,
          d.spec.?resourcesRefs.?items.orValue([]).exists(i, i.?name.orValue('') == object.metadata.name
            && i.?namespace.orValue('') == object.metadata.namespace && i.?resource.orValue('') == 'paragraphs')))
      messageExpression: >-
        'Paragraph ' + object.metadata.name + ' in namespace ' + object.metadata.namespace +
        ' is not managed by any widgets.'
