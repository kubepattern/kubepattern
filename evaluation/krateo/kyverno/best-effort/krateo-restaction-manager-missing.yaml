# Kyverno-only policy (no Pattern): G5, the label key krateo.io/managed-by contains dots and cannot be
# addressed by a KubePattern path. RESTActions generated by another RESTAction name it in that label.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: krateo-restaction-manager-missing
spec:
  validationActions: [Audit]
  evaluation:
    admission:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ["templates.krateo.io"]
        apiVersions: ["v1"]
        resources: ["restactions"]
        operations: ["CREATE", "UPDATE"]
  matchConditions:
    - name: has-generator
      expression: "'krateo.io/managed-by' in object.metadata.?labels.orValue({})"
  variables:
    - name: restactions
      expression: globalContext.Get("restactions.templates.krateo.io", "")
  validations:
    - expression: >-
        dyn(variables.restactions).exists(d, d.metadata.name == object.metadata.labels['krateo.io/managed-by']
          && d.metadata.namespace == object.metadata.namespace)
      messageExpression: >-
        'RESTAction ' + object.metadata.namespace + '/' + object.metadata.name +
        ' is labelled krateo.io/managed-by a RESTAction that does not exist: its generator is gone.'
