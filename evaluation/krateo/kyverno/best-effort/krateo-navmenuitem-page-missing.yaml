# Best-effort variant of equivalent/krateo-navmenuitem-page-missing.yaml.
# G1: widgetData.resourceRefId is joined with resourcesRefs.items[].id; name and namespace come from that item.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: krateo-navmenuitem-page-missing
spec:
  validationActions: [Audit]
  evaluation:
    admission:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ["widgets.templates.krateo.io"]
        apiVersions: ["v1beta1"]
        resources: ["navmenuitems"]
        operations: ["CREATE", "UPDATE"]
  variables:
    - name: pages
      expression: globalContext.Get("pages.widgets.templates.krateo.io", "")
  validations:
    - expression: >-
        object.spec.?resourcesRefs.?items.orValue([])
          .filter(i, i.id == object.spec.widgetData.resourceRefId)
          .exists(i, dyn(variables.pages).exists(d, d.metadata.name == i.name && d.metadata.namespace == i.namespace))
      messageExpression: >-
        'NavMenuItem ' + object.metadata.namespace + '/' + object.metadata.name +
        ' is listed in the portal sidebar but the Page it opens (spec.resourcesRefs) does not exist.'
