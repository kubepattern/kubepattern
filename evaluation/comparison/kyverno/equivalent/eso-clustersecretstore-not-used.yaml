# 1:1 translation of patterns/external-secrets/clustersecretstore-not-used.yaml.
# Per-entry store references are matched by name only, as in KubePattern.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: eso-clustersecretstore-not-used
spec:
  validationActions: [Audit]
  evaluation:
    admission:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ["external-secrets.io"]
        apiVersions: ["v1"]
        resources: ["clustersecretstores"]
        operations: ["CREATE", "UPDATE"]
  variables:
    - name: externalsecrets
      expression: globalContext.Get("externalsecrets.external-secrets.io", "")
    - name: clusterexternalsecrets
      expression: globalContext.Get("clusterexternalsecrets.external-secrets.io", "")
  validations:
    - expression: >-
        dyn(variables.externalsecrets).exists(d,
          d.spec.?secretStoreRef.?kind.orValue('') == 'ClusterSecretStore'
          && d.spec.?secretStoreRef.?name.orValue('') == object.metadata.name)
        || dyn(variables.externalsecrets).exists(d, d.spec.?data.orValue([]).exists(e,
          e.?sourceRef.?storeRef.?name.orValue('') == object.metadata.name))
        || dyn(variables.clusterexternalsecrets).exists(d,
          d.spec.externalSecretSpec.?secretStoreRef.?kind.orValue('') == 'ClusterSecretStore'
          && d.spec.externalSecretSpec.?secretStoreRef.?name.orValue('') == object.metadata.name)
      messageExpression: >-
        'ClusterSecretStore ' + object.metadata.name +
        ' is not referenced by any ExternalSecret or ClusterExternalSecret, but keeps cluster-wide credentials to an external provider.'
