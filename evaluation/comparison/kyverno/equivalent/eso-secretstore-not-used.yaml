# 1:1 translation of patterns/external-secrets/secretstore-not-used.yaml.
# Per-entry store references are matched by name only, and PushSecret label selectors are ignored, as in KubePattern.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: eso-secretstore-not-used
spec:
  validationActions: [Audit]
  evaluation:
    admission:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ["external-secrets.io"]
        apiVersions: ["v1"]
        resources: ["secretstores"]
        operations: ["CREATE", "UPDATE"]
  variables:
    - name: externalsecrets
      expression: globalContext.Get("externalsecrets.external-secrets.io", "")
    - name: pushsecrets
      expression: globalContext.Get("pushsecrets.external-secrets.io", "")
  validations:
    - expression: >-
        dyn(variables.externalsecrets).exists(d, d.metadata.namespace == object.metadata.namespace
          && d.spec.?secretStoreRef.?kind.orValue('') != 'ClusterSecretStore'
          && d.spec.?secretStoreRef.?name.orValue('') == object.metadata.name)
        || dyn(variables.externalsecrets).exists(d, d.metadata.namespace == object.metadata.namespace
          && d.spec.?data.orValue([]).exists(e, e.?sourceRef.?storeRef.?name.orValue('') == object.metadata.name))
        || dyn(variables.externalsecrets).exists(d, d.metadata.namespace == object.metadata.namespace
          && d.spec.?dataFrom.orValue([]).exists(e, e.?sourceRef.?storeRef.?name.orValue('') == object.metadata.name))
        || dyn(variables.pushsecrets).exists(d, d.metadata.namespace == object.metadata.namespace
          && d.spec.?secretStoreRefs.orValue([]).exists(r, r.?name.orValue('') == object.metadata.name))
      messageExpression: >-
        'SecretStore ' + object.metadata.namespace + '/' + object.metadata.name +
        ' is not referenced by any ExternalSecret or PushSecret in its namespace, but keeps credentials to an external provider.'
