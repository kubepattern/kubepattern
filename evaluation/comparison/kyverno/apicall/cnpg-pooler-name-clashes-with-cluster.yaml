# Cost variant of equivalent/ (same semantics): live resource.List calls instead of GlobalContextEntries.
# Translation of patterns/cnpg/pooler-name-clashes-with-cluster.yaml (matchAll: the smell is the match).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: cnpg-pooler-name-clashes-with-cluster
spec:
  validationActions: [Audit]
  evaluation:
    admission:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ["postgresql.cnpg.io"]
        apiVersions: ["v1"]
        resources: ["poolers"]
        operations: ["CREATE", "UPDATE"]
  variables:
    - name: clusters
      expression: resource.List("postgresql.cnpg.io/v1", "clusters", "").items
  validations:
    - expression: >-
        !dyn(variables.clusters).exists(d, d.metadata.namespace == object.metadata.namespace
          && d.metadata.name == object.metadata.name)
      messageExpression: >-
        'Pooler ' + object.metadata.namespace + '/' + object.metadata.name +
        ' has the same name as a CNPG Cluster in the same namespace (forbidden by the Pooler API contract).'
