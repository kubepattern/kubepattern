# Informer-cached list of every pushsecrets.external-secrets.io (v1alpha1), all namespaces.
apiVersion: kyverno.io/v2
kind: GlobalContextEntry
metadata:
  name: pushsecrets.external-secrets.io
spec:
  kubernetesResource:
    group: external-secrets.io
    version: v1alpha1
    resource: pushsecrets
