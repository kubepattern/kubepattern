# Best-effort variant of equivalent/eso-secretstore-not-used.yaml.
# G1: a per-entry store reference counts only when the same entry names kind SecretStore (the default).
# G7: PushSecret label selectors (matchLabels and matchExpressions) are evaluated against the store labels.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: eso-secretstore-not-used
spec:
  validationActions: [Audit]
  evaluation:
    admission:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ["external-secrets.io"]
        apiVersions: ["v1"]
        resources: ["secretstores"]
        operations: ["CREATE", "UPDATE"]
  variables:
    - name: externalsecrets
      expression: globalContext.Get("externalsecrets.external-secrets.io", "")
    - name: pushsecrets
      expression: globalContext.Get("pushsecrets.external-secrets.io", "")
    - name: labels
      expression: object.metadata.?labels.orValue({})
  validations:
    - expression: >-
        dyn(variables.externalsecrets).exists(d, d.metadata.namespace == object.metadata.namespace
          && d.spec.?secretStoreRef.?kind.orValue('') != 'ClusterSecretStore'
          && d.spec.?secretStoreRef.?name.orValue('') == object.metadata.name)
        || dyn(variables.externalsecrets).exists(d, d.metadata.namespace == object.metadata.namespace
          && d.spec.?data.orValue([]).exists(e, e.?sourceRef.?storeRef.?name.orValue('') == object.metadata.name
               && e.?sourceRef.?storeRef.?kind.orValue('SecretStore') == 'SecretStore'))
        || dyn(variables.externalsecrets).exists(d, d.metadata.namespace == object.metadata.namespace
          && d.spec.?dataFrom.orValue([]).exists(e, e.?sourceRef.?storeRef.?name.orValue('') == object.metadata.name
               && e.?sourceRef.?storeRef.?kind.orValue('SecretStore') == 'SecretStore'))
        || dyn(variables.pushsecrets).exists(d, d.metadata.namespace == object.metadata.namespace
          && d.spec.?secretStoreRefs.orValue([]).exists(r, r.?kind.orValue('SecretStore') == 'SecretStore'
               && (r.?name.orValue('') == object.metadata.name
                   || (has(r.labelSelector)
                       && r.labelSelector.?matchLabels.orValue({}).all(k,
                            k in variables.labels && variables.labels[k] == r.labelSelector.matchLabels[k])
                       && r.labelSelector.?matchExpressions.orValue([]).all(x,
                            x.operator == 'In' ? (x.key in variables.labels && variables.labels[x.key] in x.values)
                            : x.operator == 'NotIn' ? !(x.key in variables.labels && variables.labels[x.key] in x.values)
                            : x.operator == 'Exists' ? x.key in variables.labels
                            : !(x.key in variables.labels))))))
      messageExpression: >-
        'SecretStore ' + object.metadata.namespace + '/' + object.metadata.name +
        ' is not referenced by any ExternalSecret or PushSecret in its namespace, but keeps credentials to an external provider.'
