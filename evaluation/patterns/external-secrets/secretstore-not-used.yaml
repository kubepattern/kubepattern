apiVersion: kubepattern.dev/v1
kind: Pattern
metadata:
  name: eso-secretstore-not-used
  labels:
    kubepattern.dev/suite: eval
    kubepattern.dev/platform: external-secrets
spec:
  displayName: SecretStore Not Used
  category: Security
  severity: MEDIUM
  message: "SecretStore {{target.metadata.namespace}}/{{target.metadata.name}} is not referenced by any ExternalSecret or PushSecret in its namespace, but keeps credentials to an external provider."
  reference: "https://external-secrets.io/latest/api/secretstore/"
  target:
    kind: SecretStore
    apiVersion: external-secrets.io/v1
    plural: secretstores
  dependencies:
    # Top-level store reference; an omitted kind defaults to SecretStore, so only ClusterSecretStore refs are excluded.
    - id: es-store
      kind: ExternalSecret
      apiVersion: external-secrets.io/v1
      plural: externalsecrets
      filters:
        matchNone:
          - path: "spec.secretStoreRef.kind"
            operator: EQUALS
            values: ["ClusterSecretStore"]
    # Per-entry store overrides (same kind, listed once).
    - id: es-entry
      kind: ExternalSecret
      apiVersion: external-secrets.io/v1
      plural: externalsecrets
    - id: push
      kind: PushSecret
      apiVersion: external-secrets.io/v1alpha1
      plural: pushsecrets
  relationships:
    matchNone:
      - with: es-store
        type: custom
        criteria:
          - targetPath: "metadata.name"
            dependencyPath: "spec.secretStoreRef.name"
            operator: EQUALS
          - targetPath: "metadata.namespace"
            dependencyPath: "metadata.namespace"
            operator: EQUALS
      - with: es-entry
        type: custom
        criteria:
          - targetPath: "metadata.name"
            dependencyPath: "spec.data[*].sourceRef.storeRef.name"
            operator: EQUALS
          - targetPath: "metadata.namespace"
            dependencyPath: "metadata.namespace"
            operator: EQUALS
      - with: es-entry
        type: custom
        criteria:
          - targetPath: "metadata.name"
            dependencyPath: "spec.dataFrom[*].sourceRef.storeRef.name"
            operator: EQUALS
          - targetPath: "metadata.namespace"
            dependencyPath: "metadata.namespace"
            operator: EQUALS
      - with: push
        type: custom
        criteria:
          - targetPath: "metadata.name"
            dependencyPath: "spec.secretStoreRefs[*].name"
            operator: EQUALS
          - targetPath: "metadata.namespace"
            dependencyPath: "metadata.namespace"
            operator: EQUALS
