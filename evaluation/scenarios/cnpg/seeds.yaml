# CloudNativePG scenario, seeds (see ground-truth.csv).
# --- cnpg-cluster-without-scheduledbackup
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: db-two-sb
  namespace: kp-db-a
  annotations:
    cnpg.io/reconciliationLoop: disabled  # object-only seed, no Postgres pods
spec:
  instances: 1
  storage:
    size: 1Gi
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: db-two-sb-hourly
  namespace: kp-db-a
spec:
  schedule: "0 0 0 1 1 *"  # yearly: no backup runs during the evaluation
  cluster:
    name: db-two-sb
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: db-two-sb-weekly
  namespace: kp-db-a
spec:
  schedule: "0 0 0 1 1 *"  # yearly: no backup runs during the evaluation
  cluster:
    name: db-two-sb
---
