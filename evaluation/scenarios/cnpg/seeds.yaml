# --- cnpg-pooler-name-clashes-with-cluster
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: db-nobackup
  namespace: kp-db-a
spec:
  cluster:
    name: db-live
  instances: 0
  type: rw
  pgbouncer:
    poolMode: session
