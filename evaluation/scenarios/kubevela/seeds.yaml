---
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: a2
  namespace: kp-vela-a
spec:
  components:
    - name: first
      type: kp-configmap
      traits:
        - type: kp-team-label
    - name: second
      type: kp-secret-config
      traits:
        - type: kp-team-label
        - type: kp-owner-annot
---
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: b1
  namespace: kp-vela-b
spec:
  components:
    - name: worker
      type: kp-worker
      traits:
        - type: kp-b-trait
