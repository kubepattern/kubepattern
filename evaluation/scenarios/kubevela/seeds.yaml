# KubeVela scenario, seeds (see ground-truth.csv).
# near-misses: used only by the second component / its second trait (nested wildcard).
---
apiVersion: core.oam.dev/v1beta1
kind: ComponentDefinition
metadata:
  name: kp-secret-config
  namespace: kp-vela-a
spec:
  workload:
    definition: {apiVersion: v1, kind: ConfigMap}
  schematic:
    cue:
      template: |
        output: {
          apiVersion: "v1"
          kind:       "ConfigMap"
          metadata: name: context.name
          data: msg: parameter.msg
        }
        parameter: msg: *"hello" | string
---
apiVersion: core.oam.dev/v1beta1
kind: TraitDefinition
metadata:
  name: kp-owner-annot
  namespace: kp-vela-a
spec:
  appliesToWorkloads: ["*"]
  schematic:
    cue:
      template: |
        patch: metadata: labels: "kp-owner-annot": parameter.value
        parameter: value: *"true" | string
# positives: never used.
