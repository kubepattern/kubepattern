# cert-manager scenario, seeds: positives, near-misses and limitation probes (see ground-truth.csv).
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ci-unused
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ci-retired
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ci-kind-omitted
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ci-foreign-group
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ci-old-ca
spec:
  selfSigned: {}
---
# near-miss: ClusterIssuer used only by a hand-made CertificateRequest (e.g. istio-csr / csi-driver style).
apiVersion: cert-manager.io/v1
kind: CertificateRequest
metadata:
  name: manual
  namespace: kp-certs
spec:
  request: 
  usages: ["digital signature", "key encipherment"]
  issuerRef:
    name: ci-manual
    kind: ClusterIssuer
    group: cert-manager.io
# positive: reference without kind means a namespaced Issuer, so ci-kind-omitted is unused.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kind-omitted
  namespace: kp-certs
spec:
  secretName: kind-omitted-tls
  dnsNames: ["kind-omitted.kp-certs.svc"]
  revisionHistoryLimit: 3
  issuerRef:
    name: ci-kind-omitted
# probe G4: same name, but the group names an external issuer type; the group is encoded in the target apiVersion string.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: foreign
  namespace: kp-certs
spec:
  secretName: foreign-tls
  dnsNames: ["foreign.kp-certs.svc"]
  revisionHistoryLimit: 3
  issuerRef:
    name: ci-foreign-group
    kind: ClusterIssuer
    group: example.com
# probe G8: Certificate api is created by post.sh (issued by ci-old-ca, then rotated to ci-new-ca).
