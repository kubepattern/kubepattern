# v2: G10 resolved. Filters compare booleans by their string form, so a suspended
# ScheduledBackup no longer counts as a backup schedule (probe db-suspended).
apiVersion: kubepattern.dev/v1
kind: Pattern
metadata:
  name: cnpg-cluster-without-scheduledbackup
  labels:
    kubepattern.dev/suite: eval-v2
    kubepattern.dev/platform: cnpg
spec:
  displayName: PostgreSQL Cluster Without Scheduled Backup
  category: Reliability
  severity: HIGH
  message: "CNPG Cluster {{target.metadata.namespace}}/{{target.metadata.name}} has no active ScheduledBackup in its namespace."
  reference: "https://cloudnative-pg.io/documentation/current/backup/"
  target:
    kind: Cluster
    apiVersion: postgresql.cnpg.io/v1
    plural: clusters
  dependencies:
    - id: schedule
      kind: ScheduledBackup
      apiVersion: postgresql.cnpg.io/v1
      plural: scheduledbackups
      filters:
        matchNone:
          - {path: "spec.suspend", operator: EQUALS, values: ["true"]}
  relationships:
    matchNone:
      - with: schedule
        type: custom
        criteria:
          - {targetPath: "metadata.name", dependencyPath: "spec.cluster.name", operator: EQUALS}
          - {targetPath: "metadata.namespace", dependencyPath: "metadata.namespace", operator: EQUALS}
