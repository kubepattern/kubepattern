apiVersion: kubepattern.dev/v1
kind: Pattern
metadata:
  name: eso-clustersecretstore-not-used
  labels:
    kubepattern.dev/suite: eval
    kubepattern.dev/platform: external-secrets
spec:
  displayName: ClusterSecretStore Not Used
  category: Security
  severity: MEDIUM
  message: "ClusterSecretStore {{target.metadata.name}} is not referenced by any ExternalSecret or ClusterExternalSecret, but keeps cluster-wide credentials to an external provider."
  reference: "https://external-secrets.io/latest/api/clustersecretstore/"
  target:
    kind: ClusterSecretStore
    apiVersion: external-secrets.io/v1
    plural: clustersecretstores
  dependencies:
    - id: es-store
      kind: ExternalSecret
      apiVersion: external-secrets.io/v1
      plural: externalsecrets
      filters:
        matchAll:
          - path: "spec.secretStoreRef.kind"
            operator: EQUALS
            values: ["ClusterSecretStore"]
    - id: es-entry
      kind: ExternalSecret
      apiVersion: external-secrets.io/v1
      plural: externalsecrets
    - id: ces
      kind: ClusterExternalSecret
      apiVersion: external-secrets.io/v1
      plural: clusterexternalsecrets
      filters:
        matchAll:
          - path: "spec.externalSecretSpec.secretStoreRef.kind"
            operator: EQUALS
            values: ["ClusterSecretStore"]
  relationships:
    matchNone:
      - with: es-store
        type: custom
        criteria:
          - targetPath: "metadata.name"
            dependencyPath: "spec.secretStoreRef.name"
            operator: EQUALS
      - with: es-entry
        type: custom
        criteria:
          - targetPath: "metadata.name"
            dependencyPath: "spec.data[*].sourceRef.storeRef.name"
            operator: EQUALS
      - with: ces
        type: custom
        criteria:
          - targetPath: "metadata.name"
            dependencyPath: "spec.externalSecretSpec.secretStoreRef.name"
            operator: EQUALS
