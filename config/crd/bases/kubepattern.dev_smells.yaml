---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: smells.kubepattern.dev
spec:
  group: kubepattern.dev
  names:
    kind: Smell
    listKind: SmellList
    plural: smells
    shortNames:
    - smell
    singular: smell
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Smell severity (LOW, MEDIUM, HIGH, CRITICAL)
      jsonPath: .spec.severity
      name: Severity
      type: string
    - description: Kind of the target resource
      jsonPath: .spec.target.kind
      name: Target Kind
      type: string
    - description: Name of the target resource
      jsonPath: .spec.target.name
      name: Target Name
      type: string
    - description: Namespace of the target resource
      jsonPath: .spec.target.namespace
      name: Target Namespace
      priority: 1
      type: string
    - description: Smell message
      jsonPath: .spec.message
      name: Message
      priority: 1
      type: string
    - description: Indicates if the smell is ignored
      jsonPath: .spec.suppress
      name: Suppressed
      priority: 1
      type: boolean
    name: v1
    schema:
      openAPIV3Schema:
        description: Smell is the Schema for the smells API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Smell
            properties:
              category:
                description: category groups related smells (e.g. "zombie-resources",
                  "misconfiguration").
                minLength: 1
                type: string
              message:
                description: message is the human-readable description of the detected
                  issue.
                type: string
              name:
                description: name is the smell name.
                minLength: 1
                type: string
              pattern:
                description: pattern identifies the Pattern that produced this smell.
                properties:
                  name:
                    description: name is the name of the Pattern that produced this
                      smell.
                    type: string
                  version:
                    description: version is the apiVersion of the Pattern that produced
                      this smell.
                    type: string
                type: object
              reference:
                description: reference points to external documentation for this smell.
                type: string
              severity:
                description: severity is the impact level of the detected smell.
                enum:
                - LOW
                - MEDIUM
                - HIGH
                - CRITICAL
                type: string
              suppress:
                default: false
                description: suppress marks this smell as a known false positive to
                  be ignored.
                type: boolean
              target:
                description: target identifies the resource that triggered this smell.
                properties:
                  apiVersion:
                    description: apiVersion is the group/version of the target resource.
                    type: string
                  kind:
                    description: kind is the Kind of the target resource.
                    type: string
                  name:
                    description: name is the name of the target resource.
                    type: string
                  namespace:
                    description: namespace is the namespace of the target resource,
                      empty for cluster-scoped resources.
                    type: string
                  uid:
                    description: uid is the UID of the target resource.
                    type: string
                required:
                - apiVersion
                - kind
                - name
                - uid
                type: object
            required:
            - category
            - name
            - target
            type: object
          status:
            description: status defines the observed state of Smell
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the Smell resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types include:
                  - "Available": the resource is fully functional
                  - "Progressing": the resource is being created or updated
                  - "Degraded": the resource failed to reach or maintain its desired state

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
