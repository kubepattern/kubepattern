---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - kubepattern.dev
  resources:
  - patterns
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kubepattern.dev
  resources:
  - patterns/finalizers
  verbs:
  - update
- apiGroups:
  - kubepattern.dev
  resources:
  - patterns/status
  verbs:
  - get
  - patch
  - update
