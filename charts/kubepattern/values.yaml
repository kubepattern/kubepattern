# NOTE: this chart requires cert-manager (https://cert-manager.io) to be installed in
# the cluster beforehand. It provisions the TLS certificate the Pattern validating
# webhook server presents — cert-manager is not bundled as a chart dependency here.

# Target image for the Go-based KubePattern operator
image:
  repository: ghcr.io/kubepattern/kubepattern
  pullPolicy: IfNotPresent
  tag: 0.0.5

replicaCount: 1

resources:
  requests:
    memory: "256Mi"
    cpu: "200m"
  limits:
    memory: "1Gi"
    cpu: "1000m"


tolerations: {}
nodeSelector: {}
affinity: {}

RBAC:
  # Define the RBAC rules for KubePattern (to scan only specific resources, modify accordingly)
  rules:
    - apiGroups: ["*"]
      resources: ["*"]
      verbs: ["get", "list", "watch"]

analysis:
  # Save the smells in the namespace of the involved resources
  saveInNamespace: true
  # Default output namespace if saveInNamespace == false or for cluster-scoped resources
  targetNamespace: kubepattern-analysis-ns
  # How often each installed Pattern is re-evaluated against the current cluster state
  requeueInterval: 1h

# Deploy example resources to test KubePattern (a Pattern CRD and a matching Pod)
example:
  enabled: true
