apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
data:
  config.yaml: |
    saveInNamespace: {{ .Values.analysis.saveInNamespace }}
    targetNamespace: {{ default .Release.Namespace .Values.analysis.targetNamespace | quote }}
    client:
      qps: {{ .Values.analysis.client.qps }}
      burst: {{ .Values.analysis.client.burst }}
