apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-clusterrole
rules:
  # 1. Rules required to analyze all cluster resources — a Pattern's target and
  # dependency kinds are only known at runtime, so this cannot be narrowed to
  # specific groups/resources ahead of time.
{{ toYaml .Values.RBAC.rules | nindent 2 }}

  # 2. Rules required to read Pattern definitions and create/manage the Smells
  # produced by the analysis.
  - apiGroups: ["kubepattern.dev"]
    resources: ["patterns", "smells"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["kubepattern.dev"]
    resources: ["patterns/finalizers"]
    verbs: ["update"]
  - apiGroups: ["kubepattern.dev"]
    resources: ["patterns/status"]
    verbs: ["get", "patch", "update"]